></main><footer class="border-t border-[rgba(21,23,19,0.14)] bg-[#151713] text-[#f7f2e8]"><div class="max-w-[1160px] mx-auto px-4 sm:px-6 lg:px-8 py-7"><div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-sm"><div class="flex items-center gap-3"><span class="grid h-8 w-8 place-items-center rounded-[8px] border border-[#f7f2e8]/30 text-xs font-bold">T</span><span>EzTutorial - Kiang 技术笔记</span></div><div class="flex items-center gap-6 text-[#d7d0c1]"><a class="hover:text-white transition-colors" href="/">首页</a><a href="https://kiang.website" target="_blank" class="hover:text-white transition-colors">Kiang</a><span>© 2026</span></div></div></div></footer></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"tag":"nextjs","posts":[{"id":"nextjs-best-practices","slug":"nextjs-best-practices","content":"\n# Next.js 开发最佳实践\n\nNext.js 14 带来了许多激动人心的特性。\n\n## App Router\n\nApp Router 是 Next.js 13+ 推荐的 routing 方案。\n\n### 核心概念\n\n```typescript\n// app/page.tsx\nexport default function Home() {\n  return \u003ch1\u003eHello Next.js!\u003c/h1\u003e\n}\n```\n\n## Server Components\n\n默认情况下，Next.js 的组件都是 Server Components。\n\n### 优势\n\n- 减少客户端 JavaScript\n- 直接访问后端资源\n- 更好的性能\n\n### 使用 Client Components\n\n当需要使用浏览器 API 或 React hooks 时：\n\n```typescript\n'use client'\n\nimport { useState } from 'react'\n\nexport default function Counter() {\n  const [count, setCount] = useState(0)\n  return \u003cbutton onClick={() =\u003e setCount(c + 1)}\u003e{count}\u003c/button\u003e\n}\n```\n\n## 数据获取\n\n### Server Components 中获取数据\n\n```typescript\nasync function getData() {\n  const res = await fetch('https://api.example.com/data')\n  return res.json()\n}\n\nexport default async function Page() {\n  const data = await getData()\n  return \u003cdiv\u003e{data.title}\u003c/div\u003e\n}\n```\n\n## 部署\n\n推荐使用 Vercel 进行部署：\n\n```bash\nvercel --prod\n```\n\n## 总结\n\nNext.js 14 是现代 React 应用的首选框架。\n","readingTime":1,"title":"Next.js 开发最佳实践","date":"2026-03-05","modified":"2026-03-06","category":"技术","tags":["nextjs","react","frontend"],"excerpt":"总结 Next.js 14 开发中的最佳实践，包括 App Router、Server Components、数据获取等核心概念。"}],"tags":["eztutorial","frontend","markdown","nextjs","react","开始"]},"__N_SSG":true},"page":"/tags/[tag]","query":{"tag":"nextjs"},"buildId":"g9aBWqH8eMhmNLFZPTEtp","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
